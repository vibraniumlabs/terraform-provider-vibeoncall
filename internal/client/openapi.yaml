    MaintenanceWindowStatus:
      type: string
      enum:
        - upcoming
        - active
        - ended
      description: Where the window sits relative to the current time.
    MaintenanceWindowSeverityCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - severity
        rule:
          type: object
          properties:
            operator:
              type: string
              enum: &a5
                - equal_to
                - less_than
                - greater_than
                - less_than_or_equal
                - greater_than_or_equal
            severity:
              type: string
          required:
            - operator
            - severity
      required:
        - type
        - rule
      description: rule.severity accepts the canonical SEV0-SEV5 or SIGNAL, or an alias such as P1 or critical.
    MaintenanceWindowFieldCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - field
        rule:
          type: object
          properties:
            fieldPath:
              type: string
              minLength: 1
              description: Dot-path into the payload this rule is evaluated against. Alert routing, enrichment and maintenance-window rules evaluate the incoming payload, where the source's own fields are under `details`; automation rules evaluate the stored alert, where the same fields are under `metadata`. A path that matches nothing makes the rule silently never fire.
            operator:
              type: string
              enum: &a6
                - contains
                - exact_match
                - not_contains
                - matches_regex
            conditionValue:
              type: string
            isCaseSensitive:
              type:
                - boolean
                - "null"
          required:
            - fieldPath
            - operator
            - conditionValue
      required:
        - type
        - rule
    MaintenanceWindowProviderCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - provider
        rule:
          type: object
          properties:
            operator:
              type: string
              enum:
                - one_of
            providers:
              type: array
              items:
                type: string
                enum: &a7
                  - opsgenie
                  - grafana
                  - datadog
                  - coralogix
                  - newrelic
                  - prometheus
                  - cloudwatch
                  - sns
                  - heartbeat
                  - email
                  - sentry
                  - embraceio
                  - http
                  - azuremonitor
                  - cloudamqp
              minItems: 1
          required:
            - operator
            - providers
      required:
        - type
        - rule
    MaintenanceWindowTimeCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - time
        rule:
          type: object
          properties:
            timezone:
              type: string
              minLength: 1
            operator:
              type: string
              enum: &a8
                - day_in_between
                - week_in_between
            timeInterval:
              anyOf:
                - type: object
                  properties:
                    startHourOffset:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    endHourOffset:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                  required:
                    - startHourOffset
                    - endHourOffset
                - type: object
                  properties:
                    weekRanges:
                      type: array
                      items:
                        type: object
                        properties:
                          startDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                          endDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                          startHourOffset:
                            type: string
                            pattern: ^\d{2}:\d{2}$
                          endHourOffset:
                            type: string
                            pattern: ^\d{2}:\d{2}$
                        required:
                          - startDay
                          - endDay
                          - startHourOffset
                          - endHourOffset
                      minItems: 1
                  required:
                    - weekRanges
          required:
            - timezone
            - operator
            - timeInterval
      required:
        - type
        - rule
    MaintenanceWindowLeafCondition:
      anyOf:
        - $ref: "#/components/schemas/MaintenanceWindowSeverityCondition"
        - $ref: "#/components/schemas/MaintenanceWindowFieldCondition"
        - $ref: "#/components/schemas/MaintenanceWindowProviderCondition"
        - $ref: "#/components/schemas/MaintenanceWindowTimeCondition"
      description: One condition on the incoming alert payload. severity compares the alert severity; field matches a dot-path in the payload (source fields live under `details`); provider matches the source integration; time matches a recurring daily or weekly interval in the given timezone.
    MaintenanceWindowCondition:
      anyOf:
        - $ref: "#/components/schemas/MaintenanceWindowSeverityCondition"
        - $ref: "#/components/schemas/MaintenanceWindowFieldCondition"
        - $ref: "#/components/schemas/MaintenanceWindowProviderCondition"
        - $ref: "#/components/schemas/MaintenanceWindowTimeCondition"
        - type: object
          properties:
            type:
              type: string
              enum:
                - group
            operator:
              type: string
              enum:
                - AND
                - OR
              description: How the conditions inside this group combine.
            conditions:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/MaintenanceWindowSeverityCondition"
                  - $ref: "#/components/schemas/MaintenanceWindowFieldCondition"
                  - $ref: "#/components/schemas/MaintenanceWindowProviderCondition"
                  - $ref: "#/components/schemas/MaintenanceWindowTimeCondition"
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - group
                      operator:
                        type: string
                        enum:
                          - AND
                          - OR
                        description: How the conditions inside this group combine.
                      conditions:
                        type: array
                        items:
                          anyOf:
                            - $ref: "#/components/schemas/MaintenanceWindowSeverityCondition"
                            - $ref: "#/components/schemas/MaintenanceWindowFieldCondition"
                            - $ref: "#/components/schemas/MaintenanceWindowProviderCondition"
                            - $ref: "#/components/schemas/MaintenanceWindowTimeCondition"
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - group
                                operator:
                                  type: string
                                  enum:
                                    - AND
                                    - OR
                                  description: How the conditions inside this group combine.
                                conditions:
                                  type: array
                                  items:
                                    anyOf:
                                      - $ref: "#/components/schemas/MaintenanceWindowSeverityCondition"
                                      - $ref: "#/components/schemas/MaintenanceWindowFieldCondition"
                                      - $ref: "#/components/schemas/MaintenanceWindowProviderCondition"
                                      - $ref: "#/components/schemas/MaintenanceWindowTimeCondition"
                                      - type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - group
                                          operator:
                                            type: string
                                            enum:
                                              - AND
                                              - OR
                                            description: How the conditions inside this group combine.
                                          conditions:
                                            type: array
                                            items:
                                              $ref: "#/components/schemas/MaintenanceWindowLeafCondition"
                                            minItems: 1
                                        required:
                                          - type
                                          - operator
                                          - conditions
                                  minItems: 1
                              required:
                                - type
                                - operator
                                - conditions
                        minItems: 1
                    required:
                      - type
                      - operator
                      - conditions
              minItems: 1
          required:
            - type
            - operator
            - conditions
      description: A leaf condition or a parenthesised group of conditions. Groups may nest up to 5 levels deep.
    MaintenanceWindowAnnouncementChannel:
      type: object
      properties:
        id:
          type: string
          description: Platform channel ID.
        name:
          type: string
          description: Channel display name at the time it was set.
      required:
        - id
        - name
    MaintenanceWindow:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the maintenance window.
          format: int32
        name:
          type: string
          description: Display name.
        description:
          type:
            - string
            - "null"
          description: Description.
        teamId:
          type:
            - integer
            - "null"
          description: ID of the team the window is scoped to, or null for a global window.
          format: int32
        startAt:
          type: string
          format: date-time
          description: ISO 8601 start instant.
        endAt:
          type: string
          format: date-time
          description: ISO 8601 end instant.
        status:
          $ref: "#/components/schemas/MaintenanceWindowStatus"
        conditions:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MaintenanceWindowCondition"
          description: Conditions limiting which in-scope alerts the window applies to; null when it applies to all.
        conditionsLogicalOperator:
          type:
            - string
            - "null"
          enum:
            - AND
            - OR
          description: How the top-level conditions combine; null when there are no conditions.
        announcementChannels:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceWindowAnnouncementChannel"
          description: Chat channels the window announces its start and end in; empty when it announces nowhere.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last-update timestamp.
      required:
        - id
        - name
        - description
        - teamId
        - startAt
        - endAt
        - status
        - conditions
        - conditionsLogicalOperator
        - announcementChannels
        - createdAt
        - updatedAt
    MaintenanceWindowsListResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of maintenance windows matching the filters.
          format: int32
        hasMore:
          type: boolean
          description: Whether more maintenance windows are available beyond the current page.
        maintenanceWindows:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceWindow"
      required:
        - total
        - hasMore
        - maintenanceWindows
    MaintenanceWindowResponse:
      type: object
      properties:
        maintenanceWindow:
          $ref: "#/components/schemas/MaintenanceWindow"
      required:
        - maintenanceWindow
    CreateMaintenanceWindowRequest:
      type: object
      properties:
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Team the window is scoped to. Omit or send null for a global window that applies to every team in the organization. Fixed after creation.
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Display name (max 64 characters).
        description:
          type:
            - string
            - "null"
          maxLength: 512
          description: Description (max 512 characters).
        startAt:
          type: string
          format: date-time
          description: ISO 8601 start instant. On create it must not be more than two minutes in the past.
        endAt:
          type: string
          format: date-time
          description: ISO 8601 end instant. Must be after startAt.
        conditions:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MaintenanceWindowCondition"
          minItems: 1
          description: Limits which in-scope alerts the window applies to. Omit or send null to suppress automatic paging for every alert in scope. Must be sent together with conditionsLogicalOperator.
        conditionsLogicalOperator:
          type:
            - string
            - "null"
          enum: &a2
            - AND
            - OR
          description: How the top-level conditions combine. Must be sent together with conditions.
        announcementChannels:
          type:
            - array
            - "null"
          items:
            type: string
            minLength: 1
          description: IDs of the chat channels to announce the window start and end in, as returned by GET /integrations/chat/channels. Every ID must belong to the connected chat platform. Omit or send null or an empty list for no announcements.
      required:
        - name
        - startAt
        - endAt
      additionalProperties: false
    UpdateMaintenanceWindowRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Display name (max 64 characters).
        description:
          type:
            - string
            - "null"
          maxLength: 512
          description: Description (max 512 characters).
        startAt:
          type: string
          format: date-time
          description: ISO 8601 start instant. On create it must not be more than two minutes in the past.
        endAt:
          type: string
          format: date-time
          description: ISO 8601 end instant. Must be after startAt.
        conditions:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MaintenanceWindowCondition"
          minItems: 1
          description: Limits which in-scope alerts the window applies to. Omit or send null to suppress automatic paging for every alert in scope. Must be sent together with conditionsLogicalOperator.
        conditionsLogicalOperator:
          type:
            - string
            - "null"
          enum: *a2
          description: How the top-level conditions combine. Must be sent together with conditions.
        announcementChannels:
          type:
            - array
            - "null"
          items:
            type: string
            minLength: 1
          description: IDs of the chat channels to announce the window start and end in, as returned by GET /integrations/chat/channels. Every ID must belong to the connected chat platform. Omit or send null or an empty list for no announcements.
      additionalProperties: false
      description: "Partial update: only the fields sent are changed. The team scope is fixed at creation. To end an active window early, send endAt set to the current time. Ended windows cannot be updated; active windows cannot change startAt and must keep endAt at or after the current time."
    MaintenanceWindowSuppressedAlertsResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of alerts whose automatic paging this window suppressed.
          format: int32
        hasMore:
          type: boolean
          description: Whether more alerts are available beyond the current page.
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertSummary"
      required:
        - total
        - hasMore
        - alerts
    AlertSource:
      type: object
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
        name:
          type: string
        provider:
          type: string
          enum: &a3
            - opsgenie
            - grafana
            - datadog
            - coralogix
            - newrelic
            - prometheus
            - cloudwatch
            - sns
            - email
            - sentry
            - embraceio
            - http
            - azuremonitor
            - cloudamqp
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        alertRoutingId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        deduplication:
          description: Null uses the provider default; an empty string disables matching. Omission preserves the setting on update.
          anyOf: &a4
            - $ref: "#/components/schemas/AlertSourceDeduplication"
            - type: "null"
        isEnabled:
          type: boolean
        webhookUrl:
          type:
            - string
            - "null"
          description: Where the monitoring tool posts alerts; null for an email source.
        webhookToken:
          type:
            - string
            - "null"
          description: The secret token at the end of webhookUrl; null for an email source.
        emailAddress:
          type:
            - string
            - "null"
          description: The inbound address of an email source; null otherwise.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - teamId
        - alertRoutingId
        - deduplication
        - isEnabled
        - webhookUrl
        - webhookToken
        - emailAddress
        - createdAt
        - updatedAt
    AlertSourceListResponse:
      type: object
      properties:
        alertSources:
          type: array
          items:
            $ref: "#/components/schemas/AlertSource"
      required:
        - alertSources
    CreateAlertSourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique within its scope and provider.
        provider:
          type: string
          enum: *a3
          description: The monitoring tool that delivers to this source. Cannot be changed later.
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Omit or send null for an organization-level source. Cannot be changed later.
        deduplication:
          description: Null uses the provider default; an empty string disables matching. Omission preserves the setting on update.
          anyOf: *a4
        alertRoutingId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: The alert routing in the same scope that handles alerts arriving on this source.
        isEnabled:
          type: boolean
          description: A source that is off rejects what arrives on it. Defaults to true.
      required:
        - name
        - provider
      additionalProperties: false
    UpdateAlertSourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        deduplication:
          description: Null uses the provider default; an empty string disables matching. Omission preserves the setting on update.
          anyOf: *a4
        alertRoutingId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: The alert routing in the same scope that handles alerts arriving on this source.
        isEnabled:
          type: boolean
      additionalProperties: false
      minProperties: 1
    AlertRoutingSeverityCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - severity
        rule:
          type: object
          properties:
            operator:
              type: string
              enum: *a5
            severity:
              type: string
          required:
            - operator
            - severity
      required:
        - type
        - rule
      description: rule.severity accepts the canonical SEV0-SEV5 or SIGNAL, or an alias such as P1 or critical; an alias reads back as its canonical value.
    AlertRoutingFieldCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - field
        rule:
          type: object
          properties:
            fieldPath:
              type: string
              minLength: 1
              description: Dot-path into the payload this rule is evaluated against. Alert routing, enrichment and maintenance-window rules evaluate the incoming payload, where the source's own fields are under `details`; automation rules evaluate the stored alert, where the same fields are under `metadata`. A path that matches nothing makes the rule silently never fire.
            operator:
              type: string
              enum: *a6
            conditionValue:
              type: string
            isCaseSensitive:
              type:
                - boolean
                - "null"
          required:
            - fieldPath
            - operator
            - conditionValue
      required:
        - type
        - rule
    AlertRoutingProviderCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - provider
        rule:
          type: object
          properties:
            operator:
              type: string
              enum:
                - one_of
            providers:
              type: array
              items:
                type: string
                enum: *a7
              minItems: 1
          required:
            - operator
            - providers
      required:
        - type
        - rule
    AlertRoutingCountCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - count
        rule:
          type: object
          properties:
            countThreshold:
              type: integer
              exclusiveMinimum: 0
              minimum: 2
            timeframe:
              type: integer
              exclusiveMinimum: 0
              minimum: 60000
              description: Milliseconds
          required:
            - countThreshold
            - timeframe
      required:
        - type
        - rule
      description: Matches once countThreshold alerts arrived within timeframe milliseconds.
    AlertRoutingTimeCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - time
        rule:
          type: object
          properties:
            timezone:
              type: string
              minLength: 1
            operator:
              type: string
              enum: *a8
            timeInterval:
              anyOf:
                - type: object
                  properties:
                    startHourOffset:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    endHourOffset:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                  required:
                    - startHourOffset
                    - endHourOffset
                - type: object
                  properties:
                    weekRanges:
                      type: array
                      items:
                        type: object
                        properties:
                          startDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                          endDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                          startHourOffset:
                            type: string
                            pattern: ^\d{2}:\d{2}$
                          endHourOffset:
                            type: string
                            pattern: ^\d{2}:\d{2}$
                        required:
                          - startDay
                          - endDay
                          - startHourOffset
                          - endHourOffset
                      minItems: 1
                  required:
                    - weekRanges
          required:
            - timezone
            - operator
            - timeInterval
      required:
        - type
        - rule
    AlertRoutingLeafCondition:
      anyOf:
        - $ref: "#/components/schemas/AlertRoutingSeverityCondition"
        - $ref: "#/components/schemas/AlertRoutingFieldCondition"
        - $ref: "#/components/schemas/AlertRoutingProviderCondition"
        - $ref: "#/components/schemas/AlertRoutingCountCondition"
        - $ref: "#/components/schemas/AlertRoutingTimeCondition"
      description: One condition on the incoming alert payload. field matches a dot-path in the payload (source fields live under `details`).
    AlertRoutingCondition:
      anyOf:
        - $ref: "#/components/schemas/AlertRoutingSeverityCondition"
        - $ref: "#/components/schemas/AlertRoutingFieldCondition"
        - $ref: "#/components/schemas/AlertRoutingProviderCondition"
        - $ref: "#/components/schemas/AlertRoutingCountCondition"
        - $ref: "#/components/schemas/AlertRoutingTimeCondition"
        - type: object
          properties:
            type:
              type: string
              enum:
                - group
            operator:
              type: string
              enum:
                - AND
                - OR
              description: How the conditions inside this group combine.
            conditions:
              type: array
              items:
                anyOf:
                  - $ref: "#/components/schemas/AlertRoutingSeverityCondition"
                  - $ref: "#/components/schemas/AlertRoutingFieldCondition"
                  - $ref: "#/components/schemas/AlertRoutingProviderCondition"
                  - $ref: "#/components/schemas/AlertRoutingCountCondition"
                  - $ref: "#/components/schemas/AlertRoutingTimeCondition"
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - group
                      operator:
                        type: string
                        enum:
                          - AND
                          - OR
                        description: How the conditions inside this group combine.
                      conditions:
                        type: array
                        items:
                          anyOf:
                            - $ref: "#/components/schemas/AlertRoutingSeverityCondition"
                            - $ref: "#/components/schemas/AlertRoutingFieldCondition"
                            - $ref: "#/components/schemas/AlertRoutingProviderCondition"
                            - $ref: "#/components/schemas/AlertRoutingCountCondition"
                            - $ref: "#/components/schemas/AlertRoutingTimeCondition"
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - group
                                operator:
                                  type: string
                                  enum:
                                    - AND
                                    - OR
                                  description: How the conditions inside this group combine.
                                conditions:
                                  type: array
                                  items:
                                    anyOf:
                                      - $ref: "#/components/schemas/AlertRoutingSeverityCondition"
                                      - $ref: "#/components/schemas/AlertRoutingFieldCondition"
                                      - $ref: "#/components/schemas/AlertRoutingProviderCondition"
                                      - $ref: "#/components/schemas/AlertRoutingCountCondition"
                                      - $ref: "#/components/schemas/AlertRoutingTimeCondition"
                                      - type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - group
                                          operator:
                                            type: string
                                            enum:
                                              - AND
                                              - OR
                                            description: How the conditions inside this group combine.
                                          conditions:
                                            type: array
                                            items:
                                              $ref: "#/components/schemas/AlertRoutingLeafCondition"
                                            minItems: 1
                                        required:
                                          - type
                                          - operator
                                          - conditions
                                  minItems: 1
                              required:
                                - type
                                - operator
                                - conditions
                        minItems: 1
                    required:
                      - type
                      - operator
                      - conditions
              minItems: 1
          required:
            - type
            - operator
            - conditions
      description: A leaf condition or a parenthesised group of conditions. Groups may nest up to 5 levels deep.
    AlertRoutingEscalateAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - ESCALATE
        value:
          type: object
          properties:
            escalation:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - escalationPolicy
                      - schedule
                      - user
                  value:
                    type: integer
                    exclusiveMinimum: 0
                    description: ID of the escalation policy, schedule or member.
                required:
                  - type
                  - value
                additionalProperties: false
              minItems: 1
            notificationUrgency:
              type: string
              enum:
                - HIGH
                - MEDIUM
                - LOW
            delayMs:
              type: integer
              minimum: 60000
              maximum: 86400000
          required:
            - escalation
          additionalProperties: false
      required:
        - type
        - value
      additionalProperties: false
      description: Page the targets. delayMs waits before paging; notificationUrgency overrides the paging urgency.
    AlertRoutingDoNothingAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - DO_NOTHING
      required:
        - type
      additionalProperties: false
      description: "Silence: create the alert without paging anyone."
    AlertRoutingRule:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
        logicalOperator:
          type: string
          enum: &a9
            - AND
            - OR
          description: How the top-level conditions combine.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AlertRoutingCondition"
          description: An empty list with logicalOperator AND is the fallback rule, which matches every alert.
        action:
          anyOf:
            - $ref: "#/components/schemas/AlertRoutingEscalateAction"
            - $ref: "#/components/schemas/AlertRoutingDoNothingAction"
      required:
        - name
        - logicalOperator
        - conditions
        - action
    AlertRouting:
      type: object
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
        name:
          type: string
        description:
          type:
            - string
            - "null"
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        isEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRoutingRule"
          description: Rules in evaluation order.
      required:
        - id
        - name
        - description
        - teamId
        - isEnabled
        - createdAt
        - updatedAt
        - rules
    AlertRoutingListResponse:
      type: object
      properties:
        alertRoutings:
          type: array
          items:
            $ref: "#/components/schemas/AlertRouting"
      required:
        - alertRoutings
    AlertRoutingRuleInput:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
        logicalOperator:
          type: string
          enum: *a9
          description: How the top-level conditions combine.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AlertRoutingCondition"
          description: An empty list with logicalOperator AND is the fallback rule, which matches every alert.
        action:
          anyOf:
            - $ref: "#/components/schemas/AlertRoutingEscalateAction"
            - $ref: "#/components/schemas/AlertRoutingDoNothingAction"
      required:
        - logicalOperator
        - conditions
        - action
      additionalProperties: false
    CreateAlertRoutingRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
          maxLength: 5000
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Omit or send null for an organization-level routing. Cannot be changed later.
        isEnabled:
          type: boolean
          description: A routing that is off evaluates none of its rules. Defaults to true.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRoutingRuleInput"
          description: Rules in evaluation order; the first rule that matches decides. The list replaces every rule of the routing and reads back in the order sent. At most one fallback rule, and only last.
      required:
        - name
      additionalProperties: false
    UpdateAlertRoutingRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
          maxLength: 5000
        isEnabled:
          type: boolean
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRoutingRuleInput"
          description: Rules in evaluation order; the first rule that matches decides. The list replaces every rule of the routing and reads back in the order sent. At most one fallback rule, and only last.
      additionalProperties: false
      minProperties: 1
  parameters: {}
paths:
  /teams:
    get:
      tags:
        - Teams
      summary: List teams for the organization
      description: Returns a paginated list of teams for the organization associated with the API key.
      operationId: listTeams
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Maximum number of items to return (default 20, max 100).
            format: int32
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
            description: Number of items to skip before starting to collect the result set.
            format: int32
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: List of teams for the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsListResponse"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Teams
      summary: Create a team
      description: Creates a team for the organization associated with the API key.
      operationId: createTeam
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          description: Invalid team payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Permission denied: the API key is read-only, or its access does not include an action this request needs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDenialResponse"

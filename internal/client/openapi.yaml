    patch:
      tags:
        - Incidents
      summary: Update incident fields
      description: "Updates scalar incident fields for the organization associated with the API key. Supports title, description, severity, normalized status, reportedAt, resolvedAt, impactStartedAt, and impactEndedAt. reportedAt and resolvedAt cannot be cleared; resolvedAt requires resolved status (existing or in this request). Timestamp edits must leave resolvedAt at or after reportedAt. Accepted timestamps are returned in UTC. impactStartedAt and impactEndedAt are stored separately: setting them never changes reportedAt, resolvedAt or status, impactEndedAt can be set while the incident is open, and null clears either one. Edits must leave impactEndedAt at or after impactStartedAt. Returns the complete incident detail without optional expansions. For compatibility, status is canonical (open, acknowledged, resolved, blocked, observation), matching normalizedStatus, even when status is not edited. GET and create responses retain legacy status alongside normalizedStatus."
      operationId: updateIncident
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: ID of the incident.
            format: int32
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  description: New incident title.
                  example: Checkout API latency elevated
                description:
                  type:
                    - string
                    - "null"
                  description: New incident description. Send null to clear it.
                  example: Checkout API p95 latency is above the SLO threshold.
                severity:
                  type: string
                  minLength: 1
                  description: New severity (SEV0-SEV5 or SIGNAL). P0-P5 and legacy semantic aliases are also accepted.
                  example: SEV1
                status:
                  type: string
                  enum:
                    - open
                    - acknowledged
                    - resolved
                    - blocked
                    - observation
                  description: New normalized status (open, acknowledged, resolved, blocked, observation).
                  example: acknowledged
                reportedAt:
                  type: string
                  format: date-time
                  description: Incident reported/start time as an ISO 8601 timestamp with a timezone. Cannot be cleared.
                resolvedAt:
                  type: string
                  format: date-time
                  description: "Incident resolution time as an ISO 8601 timestamp with a timezone. Requires resolved status, or status: resolved in the same request. Must be at or after reportedAt. Cannot be cleared."
                impactStartedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: "When impact began, as an ISO 8601 timestamp with a timezone. Stored separately from reportedAt: setting it does not change reportedAt, resolvedAt or status. Send null to clear it."
                  example: 2026-11-18T01:12:00+09:00
                impactEndedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: "When impact ended, as an ISO 8601 timestamp with a timezone. Stored separately from resolvedAt and can be set while the incident is still open: setting it does not change resolvedAt, reportedAt or status. Must be at or after impactStartedAt when both are set. Send null to clear it."
                  example: 2026-11-18T02:40:00+09:00
              additionalProperties: false
      responses:
        "200":
          description: Updated incident detail. Both status and normalizedStatus contain the canonical normalized status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "400":
          description: Invalid parameters or request body.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Permission denied: the API key is read-only, or its access does not include an action this request needs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDenialResponse"
        "404":
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

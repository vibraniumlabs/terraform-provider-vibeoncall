  /incidents:
    post:
      tags:
        - Incidents
      operationId: createIncident
      security:
        - ApiKeyAuth: []
      summary: Create an incident
      description: Creates an incident and initiates paging by default. Delivery continues asynchronously and is visible in the dashboard. Service assignment does not select service responders. Requires incident.create, plus incident.page when paging with responders. An optional Idempotency-Key replays the original response, including execution failures, for 24 hours. Keys are scoped to the organization and operation, including across API key rotation. Interrupted execution is never resumed. After expiry a key can create a new incident. This protects retries, not incident correlation or exactly-once notification delivery. Optional impactStartedAt and impactEndedAt record the impact window; they are stored separately from reportedAt and resolvedAt and do not affect status.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x21-\x7e]+$
          required: false
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                description:
                  type: string
                  minLength: 1
                  maxLength: 20000
                severity:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - open
                    - acknowledged
                    - resolved
                    - blocked
                    - observation
                  default: open
                responders:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - team
                          teamId:
                            anyOf:
                              - type: number
                              - type: string
                                pattern: ^[0-9]+$
                        required:
                          - type
                          - teamId
                        additionalProperties: false
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - user
                          userId:
                            anyOf:
                              - type: number
                              - type: string
                                pattern: ^[0-9]+$
                        required:
                          - type
                          - userId
                        additionalProperties: false
                  default: []
                labels:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 30
                  maxItems: 5
                  default: []
                serviceIds:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9]+$
                  default: []
                pageResponders:
                  type: boolean
                  default: true
                customFields:
                  type: object
                  additionalProperties:
                    type:
                      - string
                      - "null"
                  description: Initial top-level incident custom fields. Values may be strings or null.
                  example:
                    region: us-east-1
                    owner: null
                impactStartedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: When impact began, as an ISO 8601 timestamp with a timezone. Stored separately from reportedAt, which is still set to the creation time. Null or omitted leaves it unset.
                  example: 2026-11-18T01:12:00+09:00
                impactEndedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: When impact ended, as an ISO 8601 timestamp with a timezone. Stored separately from resolvedAt and does not resolve the incident. Must be at or after impactStartedAt when both are set. Null or omitted leaves it unset.
                  example: 2026-11-18T02:40:00+09:00
              required:
                - title
                - description
                - severity
              additionalProperties: false
      responses:
        "201":
          description: Incident created; paging workflows have been initiated. Returns incident detail without optional expansions.
          headers:
            Location:
              description: URL of the created incident.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "400":
          description: Invalid input or idempotency key.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Permission denied: the API key is read-only, or its access does not include an action this request needs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDenialResponse"
        "404":
          description: A responder or service was not found in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The key is currently executing, or was used with different normalized input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution failed or was interrupted. If persisted, id identifies the incident. Execution failures are replayed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                    exclusiveMinimum: 0
                required:
                  - message
    get:
      tags:
        - Incidents
      summary: List incidents
      description: Returns a paginated list of incidents for the organization associated with the API key.
      operationId: listIncidents
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
            description: Number of items to skip before starting to collect the result set.
            format: int32
          required: false
          name: offset
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: Maximum number of items to return (default 10, max 100).
            format: int32
          required: false
          name: limit
          in: query
        - schema:
            type: string
            format: date-time
            description: ISO 8601 start of date range filter.
          required: false
          name: since
          in: query
        - schema:
            type: string
            format: date-time
            description: ISO 8601 end of date range filter.
          required: false
          name: until
          in: query
        - schema:
            type: string
            format: date-time
            description: ISO 8601 timestamp — only return incidents whose record was updated at or after this time. Covers incident field edits (title, description, severity, status, reportedAt, resolvedAt, impactStartedAt, impactEndedAt, customFields), service assignment, archiving, responder and label assignment changes, and manual timeline entries from the portal or API. Backdated manual entries use their submission time. Responder and label requests that leave assignments unchanged do not advance it. AI-generated and automatic timeline entries alone do not advance it. Uses the incident record update time, independently of creation time and last activity.
          required: false
          name: updatedSince
          in: query
        - schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            description: Sort incidents by creation time or record update time. Defaults to createdAt (newest first). Explicit sorting takes precedence over search relevance. Equal timestamps are ordered by incident ID ascending.
          required: false
          name: sortBy
          in: query
        - schema:
            type: string
            enum:
              - ASC
              - DESC
              - asc
              - desc
            description: Sort direction, accepting uppercase or lowercase values. Defaults to DESC. When sortBy is omitted, an explicit sortOrder applies to createdAt.
          required: false
          name: sortOrder
          in: query
        - schema:
            type: array
            items:
              type: string
            description: Comma-separated severity values to filter by.
          required: false
          name: severities
          in: query
        - schema:
            type: array
            items:
              type: string
              enum:
                - open
                - acknowledged
                - resolved
                - blocked
                - observation
            description: Comma-separated normalized status values to filter by (open, acknowledged, resolved, blocked, observation).
          required: false
          name: statuses
          in: query
        - schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: 0
            description: Comma-separated team IDs to filter by assigned responder teams.
          required: false
          name: responderTeamIds
          in: query
        - schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: 0
            description: Comma-separated user IDs to filter by assigned responder users.
          required: false
          name: responderUserIds
          in: query
        - schema:
            type: array
            items:
              type: string
            description: Comma-separated Slack/Teams channel IDs to filter by.
          required: false
          name: channels
          in: query
        - schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: 0
            description: Comma-separated label IDs to filter by.
          required: false
          name: labelIds
          in: query
        - schema:
            type: array
            items:
              type: string
            description: Comma-separated service IDs to filter by assigned services. Matches incidents assigned any of the given services.
          required: false
          name: serviceIds
          in: query
        - schema:
            type: string
            format: date-time
            description: ISO 8601 timestamp — only return incidents whose last activity is before this time.
          required: false
          name: lastActivityBefore
          in: query
        - schema:
            type: string
            description: Free-text search term, matched by meaning against the incident analysis rather than literally against the title. Returns the closest matches rather than every match, and reaches only incidents whose analysis has been indexed.
          required: false
          name: searchTerm
          in: query
        - schema:
            type:
              - boolean
              - "null"
            default: true
            description: Whether to include archived incidents (default true).
          required: false
          name: includeArchived
          in: query
      responses:
        "200":
          description: List of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentsListResponse"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /escalations:
    post:
      tags:
        - Escalations
      operationId: createEscalation
      security:
        - ApiKeyAuth: []
      summary: Page an alert or incident through an escalation policy
      description: Pages exactly one existing alert or incident through any escalation policy in the API key’s organization, starting at its first tier. Requires alert.page for alertId or incident.page for incidentId, including when paging is skipped. Returns an empty 202 Accepted after durable workflow initiation, or skips paging when the target is not open or the alert is muted. It does not reopen the target. Notification delivery continues asynchronously using existing urgency and notification preferences. An optional Idempotency-Key replays the original response, including failures and skipped 202 responses, for 24 hours from reservation. Keys are scoped to the organization and operation across API key rotation. Interrupted executions are never resumed. Replays do not page again, even if a skipped target later reopens. To deliberately page again, use a new key or omit it; overlapping runs are allowed. After expiry a key can start new work. This does not guarantee exactly-once notification delivery. Limited to 60 requests per fixed 60-second window per API key, in addition to the global public API limit. Retries and skipped requests consume allowance.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x21-\x7e]+$
          required: false
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEscalationRequest"
      responses:
        "202":
          description: Accepted; workflow initiated or paging skipped. No response body; notification delivery is asynchronous.
        "400":
          description: Invalid input or idempotency key.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:

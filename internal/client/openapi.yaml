  /incidents/{id}/comments:
    post:
      tags:
        - Incidents
      summary: Add a comment to an incident
      description: Creates a visible incident comment and records a timeline event. Optionally supply author as an email, name, or description. An email matching an active user in the API key's organization links that user; unmatched values and emails of non-active users are stored as plain text. The API key remains the submitting actor. The author is set at creation and cannot be reassigned through PATCH. Optionally supply timestamp to set the comment's createdAt for historical imports. It must be at or before server time and may precede the incident. Omission uses the current time. The comment-added timeline event and notifications still occur at submission time.
      operationId: addIncidentComment
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: ID of the incident.
            format: int32
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  minLength: 1
                  description: Incident comment content.
                  example: Escalated to database team and collecting lock diagnostics.
                timestamp:
                  type: string
                  format: date-time
                  description: Comment creation time as an ISO 8601 timestamp with a timezone, stored as createdAt. Must be at or before server time; times before the incident began are allowed. Omit to use the current time. The comment-added timeline event uses submission time.
                  example: 2026-10-20T09:30:00+07:00
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Author email, name, or description. Leading and trailing whitespace is trimmed; the result must be 1–255 characters or the request is rejected with 400. An email matching an active user in the API key's organization links that user; unmatched values and emails of pending or revoked users are stored as plain text. Omit to attribute the comment to the API key. The API key remains the submitting actor in all cases.
                  example: alice@example.com
              required:
                - comment
            examples:
              linkedUser:
                summary: Link an active organization user by email
                value:
                  comment: Investigation started.
                  author: alice@example.com
              textAuthor:
                summary: Store an author name or description as text
                value:
                  comment: Investigation started.
                  author: Alice — NC Operations
              historicalComment:
                summary: Import a comment with its original creation time
                value:
                  comment: Investigation started.
                  author: Alice
                  timestamp: 2026-10-20T09:30:00+07:00
      responses:
        "200":
          description: Updated incident comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCommentsResponse"
        "400":
          description: Invalid request body, including a blank or non-string author, an invalid timestamp, or a future timestamp.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Permission denied: the API key is read-only, or its access does not include an action this request needs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDenialResponse"
        "404":
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

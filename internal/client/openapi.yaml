    patch:
      tags:
        - Alerts
      summary: Update alert severity or status
      description: "Updates alert severity, status, or both. Requires alert.update permission. Status may be open, closed, or resolved; use POST /alerts/{id}/acknowledge to acknowledge. Allowed transitions: open -> resolved/closed; acknowledged -> open/resolved/closed; closed -> open; resolved -> open/closed. Reapplying the current status is allowed. Invalid transitions reject the entire update, including severity changes. If the status changes concurrently, the entire update is rejected with 400; retry the request. Status changes affect paging and trigger the existing timeline, notification, and automation workflows. Reapplying the current status creates no status events or notifications; supplied severity changes still apply."
      operationId: updateAlert
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: ID of the alert.
            format: int32
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                severity:
                  type: string
                  description: New severity (SEV0-SEV5 or SIGNAL). Legacy semantic values and P0-P5 aliases are also accepted.
                  example: SEV0
                status:
                  type: string
                  enum:
                    - open
                    - closed
                    - resolved
                  description: New status. Use the dedicated acknowledge endpoint to acknowledge an alert.
                  example: resolved
              additionalProperties: false
              description: Provide at least one of severity or status.
              minProperties: 1
      responses:
        "200":
          description: Updated alert severity and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertUpdateResponse"
        "400":
          description: Invalid parameters, request body, status transition, or concurrent status change.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Permission denied: the API key is read-only, or its access does not include an action this request needs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDenialResponse"
        "404":
          description: Alert not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /alerts/{id}/acknowledge:
    post:
      tags:
        - Alerts
      summary: Acknowledge an alert
      description: Acknowledges an alert in the organization associated with the API key. Requires alert.acknowledge permission and no request body. Open and already acknowledged alerts are accepted; closed or resolved alerts are rejected. If the status changes concurrently, acknowledgment is rejected with 400; retry the request. Acknowledgment affects paging and triggers the existing timeline, notification, and automation workflows. An already acknowledged alert is returned without creating status events or notifications.
      operationId: acknowledgeAlert
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: ID of the alert.
            format: int32
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Acknowledged alert severity and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertUpdateResponse"
        "400":
          description: Invalid parameters, status transition, or concurrent status change.

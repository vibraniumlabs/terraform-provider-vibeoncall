  /members:
    get:
      tags:
        - Members
      summary: List members of the organization
      description: Returns a paginated list of every member of the organization associated with the API key, including members who belong to no team. Filters combine with AND; values within one repeatable filter combine with OR. Ordered by creation time, oldest first.
      operationId: listMembers
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Maximum number of items to return (default 20, max 100).
            format: int32
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
            description: Number of items to skip before starting to collect the result set.
            format: int32
          required: false
          name: offset
          in: query
        - schema:
            type: string
            minLength: 1
            description: Case-insensitive substring match against full name or email.
          required: false
          name: search
          in: query
        - schema:
            type: array
            items:
              type: string
              enum:
                - active
                - pending
                - revoked
            description: Account statuses to include (active, pending, revoked). Repeatable or comma-separated; a member matches when its status is any of the given values.
          required: false
          name: status
          in: query
        - schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: 0
            description: Organization role IDs to include. Repeatable or comma-separated; a member matches when its organization role is any of the given roles.
          required: false
          name: roleIds
          in: query
        - schema:
            type: array
            items:
              type: integer
              exclusiveMinimum: 0
            description: Label IDs to include. Repeatable or comma-separated; a member matches when it carries any of the given labels. Use the labels endpoint to look up IDs.
          required: false
          name: labelIds
          in: query
      responses:
        "200":
          description: List of members for the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersListResponse"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

          type:
            - string
            - "null"
          description: Canonical normalized status (open, acknowledged, resolved, blocked, observation).
        source:
          type: string
          description: Source type of the incident.
        externalId:
          type: string
          description: External identifier of the incident.
        reportedAt:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when the incident was reported.
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 incident resolution time, null when unknown or reopened.
        impactStartedAt:
          type:
            - string
            - "null"
          format: date-time
          description: UTC ISO 8601 timestamp when impact began. Set through the API or the dashboard, never derived, and independent of reportedAt. Null when not set.
          example: 2026-11-17T16:12:00.000Z
        impactEndedAt:
          type:
            - string
            - "null"
          format: date-time
          description: UTC ISO 8601 timestamp when impact ended. Independent of resolvedAt and of status, so it can be set on an incident that is still open. Null when not set.
          example: 2026-11-17T17:40:00.000Z
        acknowledgedAt:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when the incident was acknowledged.
        lastActivity:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the last activity on the incident. Defaults to createdAt when activity time is missing or invalid.
        archivedAt:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when the incident was archived, null if active.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the incident was created.
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
          description: UTC ISO 8601 timestamp when the incident record was last updated; the same value used by updatedSince. Includes changes to responder and label assignments, and manual timeline entry submissions. Unchanged assignments do not advance it. Automatic and AI-generated timeline entries alone do not advance it. Null when unavailable.
        externalLinks:
          description: External links associated with the incident (Slack, PagerDuty, Jira, etc.).
        customFields:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
          description: Incident custom fields as key-value pairs. Values may be null. Empty object when no custom fields are set.
        responders:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - team
                  team:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      description:
                        type: string
                    required:
                      - id
                      - name
                      - description
                required:
                  - type
                  - team
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - user
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      fullName:
                        type:
                          - string
                          - "null"
                    required:
                      - id
                      - email
                      - fullName
                required:
                  - type
                  - user
          description: Responders assigned to the incident.
        labels:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              color:
                type: string
            required:
              - id
              - name
              - color
          description: Labels applied to the incident.
        serviceCatalogs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
              links:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    type:
                      type: string
                    url:
                      type: string
                  required:
                    - title
                    - type
                    - url
              groups:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                    links:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          type:
                            type: string
                          url:
                            type: string
                        required:
                          - title
                          - type
                          - url
                  required:
                    - name
                    - kind
            required:
              - id
              - name
              - kind
              - groups
          description: Service catalog entities assigned to the incident.
        team:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
            description:
              type: string
          required:
            - id
            - name
            - description
          description: Owning team of the incident.
      required:

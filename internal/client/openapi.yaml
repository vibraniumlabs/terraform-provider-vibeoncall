  /incidents/{id}/timeline:
    post:
      tags:
        - Incidents
      summary: Add a manual incident timeline entry
      description: Creates a manual timeline entry with optional past event time. Requires incident.update. The API key is recorded as the submitting actor; metadata.isManual is true. Optionally supply author as an email, name, or description, using the same attribution rules as incident comments. Authorship is returned in metadata.author; the API key remains metadata.actor. Entries appear in event-time order and are preserved during AI timeline regeneration. General-content entries do not trigger dedicated responder notifications, but configured timeline-update automations and existing Vibe reactions still apply at submission time. There is no notify parameter. Adding an entry does not update the incident record updatedAt.
      operationId: addIncidentTimelineEntry
      security:
        - ApiKeyAuth: []
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: ID of the incident.
            format: int32
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  description: Free-text timeline entry content.
                  example: Rolled back the payments deployment.
                timestamp:
                  type: string
                  format: date-time
                  description: ISO 8601 event time with a timezone. Must be at or before server time; times before the incident began are allowed. Omit to use the current time.
                  example: 2026-10-20T09:30:00+07:00
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Author email, name, or description. Leading and trailing whitespace is trimmed; the result must be 1–255 characters or the request is rejected with 400. An email matching an active user in the API key's organization links that user; unmatched values and emails of pending or revoked users are stored as plain text. Omit to attribute the entry to the API key. The API key remains the submitting actor in all cases.
                  example: alice@example.com
              required:
                - content
              additionalProperties: false
      responses:
        "201":
          description: Created timeline entry. The timestamp is returned in UTC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelineEntryResponse"
        "400":
          description: Invalid content, author, timestamp, future timestamp, or unsupported request fields.
          content:

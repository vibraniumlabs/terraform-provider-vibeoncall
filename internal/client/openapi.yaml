openapi: 3.1.0
info:
  title: Vibranium Public API
  version: 1.0.0
  description: |-
    Public REST API for accessing teams, team members, organization members, on-call schedules, escalation policies,
    service catalog services, maintenance windows, chat channels, alert sources, alert routings, incidents, alerts,
    and automation actions.

    Authentication is performed via API key using the Authorization header
    with a Bearer token.
    You can obtain an API key from your Vibranium account settings.
  contact:
    name: Vibranium Labs Support
    email: hello@vibraniumlabs.ai
servers:
  - url: https://api-prod.vibraniumlabs.ai/api/v1
    description: API server
tags:
  - name: Teams
    description: Operations related to teams and their members.
  - name: Members
    description: Operations related to organization members.
  - name: Schedules
    description: Operations related to on-call schedules.
  - name: Escalation Policies
    description: Operations related to escalation policies.
  - name: Escalations
    description: Page existing alerts and incidents through escalation policies.
  - name: Labels
    description: Operations related to incident labels.
  - name: Services
    description: Operations related to service catalog services.
  - name: Maintenance Windows
    description: Operations related to maintenance windows, which suppress automatic paging for a planned period.
  - name: Chat Integrations
    description: Channels of the chat platform (Slack or Microsoft Teams) the organization is connected to.
  - name: Automation Actions
    description: Operations related to automation actions and execution logs.
  - name: Alert Sources
    description: Endpoints monitoring tools deliver alerts to, each handled by one alert routing.
  - name: Alert Routings
    description: "How a team handles the alerts its sources receive: ordered rules that page, or silence."
  - name: Incidents
    description: Operations related to incidents.
  - name: Alerts
    description: Operations related to alerts.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API key provided via the Authorization header using the Bearer scheme, e.g. `Authorization: Bearer API_KEY`."
  schemas:
    TeamOnCallPolicySummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the escalation policy.
          format: int32
        name:
          type: string
          description: Name of the escalation policy used to resolve on-call responders.
        isDefault:
          type: boolean
          description: Whether this escalation policy is the team default policy.
      required:
        - id
        - name
        - isDefault
    ScheduleTeamRef:
      type: object
      properties:
        shortId:
          type: string
          description: Short identifier of the team associated with the schedule.
        name:
          type: string
          description: Name of the team associated with the schedule.
      required:
        - shortId
        - name
    IncidentCommentAuthor:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - user
            userId:
              type: integer
            email:
              type:
                - string
                - "null"
            fullName:
              type:
                - string
                - "null"
          required:
            - type
            - userId
            - email
            - fullName
        - type: object
          properties:
            type:
              type: string
              enum:
                - text
            text:
              type: string
          required:
            - type
            - text
        - type: object
          properties:
            type:
              type: string
              enum:
                - api_key
            apiKeyId:
              type: integer
          required:
            - type
            - apiKeyId
    AlertTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        shortId:
          type: string
        description:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - shortId
        - description
    AlertUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type:
            - string
            - "null"
      required:
        - id
        - email
        - fullName
    MemberRole:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the organization role.
          format: int32
        name:
          type: string
          description: Name of the organization role.
        builtInKey:
          type:
            - string
            - "null"
          enum:
            - admin
            - member
            - read_only
          description: Key of the built-in role (admin, member, read_only), or null for a custom role.
      required:
        - id
        - name
        - builtInKey
    MicrosoftTeamsTeam:
      type: object
      properties:
        id:
          type: string
          description: Microsoft Teams team ID.
        name:
          type: string
          description: Microsoft Teams team display name.
      required:
        - id
        - name
    AlertSourceDeduplication:
      type: string
      maxLength: 500
      description: Email sources only. Null uses the provider default ({{subject}}); an empty string disables matching. Templates support {{subject}}, {{sender}} and {{body}}. Template and populated key are limited to 500 characters. Matching is scoped to this source. Omit on create for the default; omit on update to preserve the setting.
    TeamSummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the team.
          format: int32
        name:
          type: string
          description: Name of the team.
        description:
          type:
            - string
            - "null"
          description: Description of the team.
        shortId:
          type: string
          description: Short identifier of the team.
        inboundEmailAddress:
          type:
            - string
            - "null"
          format: email
          description: Deprecated. No longer used for alert setup; configure email destinations through alert sources. Null when no enabled email alert source exists.
          deprecated: true
        externalProvider:
          type:
            - string
            - "null"
          description: External source provider for imported teams.
        externalTeamId:
          type:
            - string
            - "null"
          description: External source identifier for imported teams.
      required:
        - id
        - name
        - description
        - shortId
        - inboundEmailAddress
        - externalProvider
        - externalTeamId
    TeamsListResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of teams for the organization.
          format: int32
        hasMore:
          type: boolean
          description: Whether there are more teams available beyond the current page.
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamSummary"
      required:
        - total
        - hasMore
        - teams
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Validation error code.
              message:
                type: string
                description: Human-readable error message.
              path:
                type: array
                items:
                  type: string
                description: Path to the field that caused the error.
          description: Details about the validation errors.
      required:
        - error
      description: Validation error response from the API.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
      required:
        - message
      description: Generic error response.
    TeamResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the team.
          format: int32
        name:
          type: string
          description: Name of the team.
        description:
          type:
            - string
            - "null"
          description: Description of the team.
        shortId:
          type: string
          description: Short identifier of the team.
        inboundEmailAddress:
          type:
            - string
            - "null"
          format: email
          description: Deprecated. No longer used for alert setup; configure email destinations through alert sources. Null when no enabled email alert source exists.
          deprecated: true
        externalProvider:
          type:
            - string
            - "null"
          description: External source provider for imported teams.
        externalTeamId:
          type:
            - string
            - "null"
          description: External source identifier for imported teams.
      required:
        - id
        - name
        - description
        - shortId
        - inboundEmailAddress
        - externalProvider
        - externalTeamId
    ApiKeyDenialResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: "API key permission denied for action: incident.comment"
        missingActions:
          type: array
          items:
            type: string
          description: The actions this API key would need; absent when the key is read-only.
          example:
            - incident.comment
      required:
        - message
      description: Why the API key was refused.
    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
        externalProvider:
          type: string
          minLength: 1
          maxLength: 32
        externalTeamId:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
        externalProvider:
          type: string
          minLength: 1
          maxLength: 32
        externalTeamId:
          type: string
          minLength: 1
          maxLength: 128
    TeamMutationSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the mutation completed successfully.
      required:
        - success
    TeamMemberSummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the user.
          format: int32
        email:
          type: string
          description: Email address of the user.
        fullName:
          type:
            - string
            - "null"
          description: Full name of the user.
        status:
          type:
            - string
            - "null"
          enum:
            - active
            - pending
            - revoked
          description: Account status of the user in the organization (active, pending, revoked).
        role:
          type: string
          enum:
            - admin
            - member
          description: Membership role of the user in this team (admin or member). This is not the organization role returned by the members endpoints.
      required:
        - id
        - email
        - fullName
        - status
        - role
    TeamMembersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/TeamMemberSummary"
        total:
          type: integer
          description: Total number of members in the team.
          format: int32
        hasMore:
          type: boolean
          description: Whether there are more members available beyond the current page.
      required:
        - users
        - total
        - hasMore
    TeamMemberAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the assignment completed successfully.
        userId:
          type: integer
          description: ID of the assigned user.
          format: int32
        role:
          type: string
          enum:
            - admin
            - member
          description: Role assigned to the user.
      required:
        - success
        - userId
        - role
    AssignTeamMemberRequest:
      type: object
      properties:
        userId:
          type: integer
          exclusiveMinimum: 0
          description: ID of the user to assign to the team.
          format: int32
        role:
          type: string
          enum:
            - admin
            - member
          description: Team membership role. Defaults to member.
      required:
        - userId
    TeamOnCallResponderSummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the user.
          format: int32
        email:
          type: string
          description: Email address of the on-call responder.
        fullName:
          type:
            - string
            - "null"
          description: Full name of the on-call responder.
      required:
        - id
        - email
        - fullName
    TeamOnCallResponse:
      type: object
      properties:
        team:
          type: object
          properties:
            id:
              type: integer
              description: Unique identifier of the team.
              format: int32
            shortId:
              type: string
              description: Short identifier of the team.
            name:
              type: string
              description: Name of the team.
          required:
            - id
            - shortId
            - name
        escalationPolicy:
          description: Escalation policy used to resolve the team on-call responders, if one exists.
          anyOf:
            - $ref: "#/components/schemas/TeamOnCallPolicySummary"
            - type: "null"
        responders:
          type: array
          items:
            $ref: "#/components/schemas/TeamOnCallResponderSummary"
          description: Current Tier 1 on-call responders for the team.
        resolution:
          type: string
          enum:
            - default_policy
            - team_policy_fallback
            - none
          description: How the team on-call responders were resolved.
      required:
        - team
        - escalationPolicy
        - responders
        - resolution
    PublicScheduleRotationConfig:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - daily
            payload:
              type: object
              properties:
                startTime:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                endTime:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              required:
                - startTime
                - endTime
              additionalProperties: false
          required:
            - type
            - payload
          additionalProperties: false
          title: Daily rotation
        - type: object
          properties:
            type:
              type: string
              enum:
                - weekly
            payload:
              anyOf:
                - type: object
                  properties:
                    startTime:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    endTime:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    startDay:
                      type: integer
                      minimum: 0
                      maximum: 6
                    endDay:
                      type: integer
                      minimum: 0
                      maximum: 6
                    dailyStartTime:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    dailyEndTime:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    handOffDay:
                      type: integer
                      minimum: 0
                      maximum: 6
                      description: Participant handoff weekday, 0 (Sunday) through 6 (Saturday), at 00:00 in the schedule timezone, independent of coverage. Omit it to hand off at the range start (startDay at startTime).
                  required:
                    - startTime
                    - endTime
                    - startDay
                    - endDay
                  additionalProperties: false
                  title: Weekly range
                - type: object
                  properties:
                    windows:
                      type: array
                      items:
                        type: object
                        properties:
                          startTime:
                            type: string
                            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          endTime:
                            type: string
                            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          startDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                          endDay:
                            type: integer
                            minimum: 0
                            maximum: 6
                        required:
                          - startTime
                          - endTime
                          - startDay
                          - endDay
                        additionalProperties: false
                      minItems: 1
                    handOffDay:
                      type: integer
                      minimum: 0
                      maximum: 6
                      description: Participant handoff weekday, 0 (Sunday) through 6 (Saturday), at 00:00 in the schedule timezone, independent of coverage. Omit it to hand off at the start of the earliest window in the Sunday-to-Saturday week.
                  required:
                    - windows
                  additionalProperties: false
                  title: Weekly windows
          required:
            - type
            - payload
          additionalProperties: false
          title: Weekly rotation
      description: "Public daily and weekly types use the custom coverage-window payloads. Daily requires startTime and endTime; weekly accepts a day/time range or windows. Without handOffDay, a weekly rotation hands off to the next participant at the range start, or at the earliest window start in the Sunday-to-Saturday week. A range whose start and end share the same weekday and time covers a full seven days: startDay 3, startTime 12:00, endDay 3, endTime 12:00 gives continuous coverage with a Wednesday-noon handoff. With handOffDay, the handoff happens at 00:00 on that weekday instead, independent of coverage. Handoffs keep their local clock time in the schedule timezone across daylight-saving changes. Times are 24-hour HH:MM; weekdays are 0 (Sunday) through 6 (Saturday)."
    PublicScheduleRotationResponse:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        startAt:
          type: string
          format: date
          description: First date this rotation takes effect, in YYYY-MM-DD format.
          example: 2026-09-01
        rotationConfig:
          $ref: "#/components/schemas/PublicScheduleRotationConfig"
        participants:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          description: Ordered user IDs; each ID must appear only once.
        id:
          type: integer
          exclusiveMinimum: 0
          description: Rotation ID.
          format: int32
      required:
        - name
        - startAt
        - rotationConfig
        - participants
        - id
      additionalProperties: false
    PublicScheduleResponse:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        timezone:
          type: string
          minLength: 1
          description: IANA time zone for this schedule, such as America/New_York.
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: "Deprecated: use teamIds. The lowest owning team ID, or null for a global schedule."
          format: int32
          deprecated: true
        teamIds:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
            format: int32
          maxItems: 100
          description: Every owning team ID in ascending order. Empty for a global schedule.
        rotations:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleRotationResponse"
        id:
          type: integer
          exclusiveMinimum: 0
          description: Schedule ID.
          format: int32
      required:
        - name
        - timezone
        - teamId
        - teamIds
        - rotations
        - id
      additionalProperties: false
    PublicScheduleListResponse:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleResponse"
        total:
          type: integer
          minimum: 0
          format: int32
        hasMore:
          type: boolean
      required:
        - schedules
        - total
        - hasMore
    PublicScheduleRotationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        startAt:
          type: string
          format: date
          description: First date this rotation takes effect, in YYYY-MM-DD format.
          example: 2026-09-01
        rotationConfig:
          $ref: "#/components/schemas/PublicScheduleRotationConfig"
        participants:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          description: Ordered user IDs; each ID must appear only once.
      required:
        - name
        - startAt
        - rotationConfig
        - participants
      additionalProperties: false
    CreatePublicScheduleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        timezone:
          type: string
          minLength: 1
          description: IANA time zone for this schedule, such as America/New_York.
        teamId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: "Deprecated: use teamIds. A single owning team ID, or null for a global schedule. Cannot be sent with teamIds."
          format: int32
          deprecated: true
        teamIds:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
            format: int32
          maxItems: 100
          description: Owning team IDs. An empty array, or omitting both teamIds and teamId, creates a global schedule.
        rotations:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleRotationInput"
          minItems: 1
      required:
        - name
        - timezone
        - rotations
      additionalProperties: false
    UpdatePublicScheduleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        timezone:
          type: string
          minLength: 1
          description: IANA time zone for this schedule, such as America/New_York.
      additionalProperties: false
    ReplacePublicScheduleTeamsRequest:
      type: object
      properties:
        teamIds:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
            format: int32
          maxItems: 100
          description: The complete set of owning team IDs. An empty array makes the schedule global.
      required:
        - teamIds
      additionalProperties: false
    PublicRotationIdResponse:
      type: object
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
          description: Rotation ID.
          format: int32
      required:
        - id
    PublicScheduleRotationUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        startAt:
          type: string
          format: date
          description: First date this rotation takes effect, in YYYY-MM-DD format.
          example: 2026-09-01
        rotationConfig:
          $ref: "#/components/schemas/PublicScheduleRotationConfig"
        participants:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          description: Ordered user IDs; each ID must appear only once.
        storeParticipantsAsSent:
          type: boolean
          description: When true, participants are stored exactly in the order supplied, so startAt and the order alone decide who is on call, and removing or appending a participant can change who is on call now. When false or omitted, an update that only removes participants or appends them at the end may rotate the stored order so the person on call now stays on call; repeating the same PUT can then save a different order and change future handoffs.
      required:
        - name
        - startAt
        - rotationConfig
        - participants
      additionalProperties: false
    PublicOnCallResponder:
      type: object
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
          description: Responder user ID.
          format: int32
        name:
          type: string
          description: Responder name.
        email:
          type: string
          format: email
          description: Responder email address.
      required:
        - id
        - name
        - email
    ScheduleCurrentOnCallResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the schedule.
          format: int32
        name:
          type: string
          description: Name of the schedule.
        team:
          description: Team associated with the schedule, if any.
          anyOf:
            - $ref: "#/components/schemas/ScheduleTeamRef"
            - type: "null"
        onCallResponders:
          type: array
          items:
            $ref: "#/components/schemas/PublicOnCallResponder"
          description: Current responders, deduplicated by user ID across rotations. Empty when there is no active coverage.
      required:
        - id
        - name
        - team
        - onCallResponders
      example:
        id: 51
        name: Response
        team:
          shortId: VP-TEAM-ABC123
          name: Platform
        onCallResponders:
          - id: 11
            name: Alice
            email: alice@example.com
    PublicScheduleOverrideResponse:
      type: object
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
          description: Override ID.
          format: int32
        rotationId:
          type: integer
          exclusiveMinimum: 0
          description: Rotation ID.
          format: int32
        userId:
          type: integer
          exclusiveMinimum: 0
          description: Assigned user ID.
          format: int32
        startAt:
          type: string
          format: date-time
          description: UTC instant corresponding to this override boundary in the schedule timezone.
          example: 2026-09-01T03:00:00Z
        endAt:
          type: string
          format: date-time
          description: UTC instant corresponding to this override boundary in the schedule timezone.
          example: 2026-09-01T05:00:00Z
      required:
        - id
        - rotationId
        - userId
        - startAt
        - endAt
    PublicScheduleOverrideListResponse:
      type: object
      properties:
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleOverrideResponse"
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
      required:
        - overrides
        - total
        - hasMore
    PublicScheduleOverrideRequest:
      type: object
      properties:
        userId:
          type: integer
          exclusiveMinimum: 0
          description: User ID in the API key organization.
          format: int32
        startAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp with an explicit offset. The offset defines an instant, which is converted to the schedule timezone before saving the override clock boundary. For an Asia/Taipei schedule, 2026-09-01T10:00:00+07:00 and 2026-09-01T11:00:00+08:00 both mean 11:00 on the schedule clock.
          example: 2026-09-01T10:00:00+07:00
        endAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp with an explicit offset. The offset defines an instant, which is converted to the schedule timezone before saving the override clock boundary. For an Asia/Taipei schedule, 2026-09-01T10:00:00+07:00 and 2026-09-01T11:00:00+08:00 both mean 11:00 on the schedule clock.
          example: 2026-09-01T12:00:00+07:00
      required:
        - userId
        - startAt
        - endAt
      additionalProperties: false
    ScheduleOnCallSummary:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the schedule.
          format: int32
        name:
          type: string
